name: 神州顺风车监控

# 三件事：
#   1. 每 30 分钟抓一轮顺风车（:07 / :37），有新车上线/被锁定/回到订单库时发通知
#   2. 把面板数据 dashboard/dashboard.json 提交回仓库（长租行情由 rental.yml 独立刷新）
#   3. 发布到 GitHub Pages → https://<用户名>.github.io/<仓库名>/
#
# 一次性准备：
#   Settings → Secrets and variables → Actions 里加：
#     SZHITCH_SMTP_HOST  smtp.qq.com / smtp.163.com / smtp.gmail.com …
#     SZHITCH_SMTP_PORT  465
#     SZHITCH_SMTP_USER  你的邮箱
#     SZHITCH_SMTP_PASS  邮箱授权码（不是登录密码）
#     SZHITCH_SMTP_TO    默认收件邮箱，多个用英文逗号分隔（可留空）
#     SZHITCH_SMTP_FROM  （可选）发件人地址，默认等于 SMTP_USER
#     SZHITCH_WECOM      （可选）企业微信机器人 webhook
#   Settings → Pages → Source 选 "GitHub Actions"
#
# 注意：Free 套餐的 Pages 仅支持公开仓库。仓库是公开的，所以密钥一律走 Secrets，
# 不要写进 config.json —— 下面有一步会检查并拦截。

on:
  schedule:
    # 每 30 分钟一轮。刻意避开 :00 / :30 —— 那是 GitHub 全局调度最挤的两个分钟点，
    # 负载高时定时会被推迟几十分钟甚至直接丢弃；错峰到 :07 / :37 准时率高得多。
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      source:
        # 外部定时器（本机计划任务 / cron-job.org）传 scheduler，
        # 撞车时会被新鲜度守卫跳过；面板上手点默认 manual，永远照跑。
        description: 触发来源
        type: string
        default: manual
  # 改了工作流或筛选条件时立刻跑一次，方便验证
  push:
    branches: [main]
    paths:
      - ".github/workflows/szhitch.yml"
      - "config.json"

concurrency:
  group: szhitch
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # 订阅 Issue 回执（命中结果评论，GitHub 会邮件通知订阅者）

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skipped: ${{ steps.freshness.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 config.json 不含密钥
        run: |
          if grep -qE '"(password|wecom_webhook|feishu_webhook|dingtalk_webhook|bark_key|serverchan_key)": *"[^"]+"' config.json; then
            echo "::error::config.json 里出现明文密钥。这是公开仓库，请改用 Settings → Secrets。"
            exit 1
          fi

      - name: 新鲜度守卫（多路定时器撞车时去重）
        id: freshness
        env:
          # schedule / push 事件没有 inputs，脚本按事件类型兜底判断
          SZHITCH_TRIGGER_SOURCE: ${{ inputs.source }}
        run: python tools/freshness_guard.py

      - name: 恢复上次状态（用于判断新增 / 锁定）
        uses: actions/cache/restore@v4
        with:
          path: data
          key: szhitch-state-${{ github.run_id }}
          restore-keys: szhitch-state-

      - name: 抓取并推送
        if: steps.freshness.outputs.skip != 'true'
        env:
          SZHITCH_SMTP_HOST: ${{ secrets.SZHITCH_SMTP_HOST }}
          SZHITCH_SMTP_PORT: ${{ secrets.SZHITCH_SMTP_PORT }}
          SZHITCH_SMTP_USER: ${{ secrets.SZHITCH_SMTP_USER }}
          SZHITCH_SMTP_PASS: ${{ secrets.SZHITCH_SMTP_PASS }}
          SZHITCH_SMTP_TO: ${{ secrets.SZHITCH_SMTP_TO }}
          SZHITCH_SMTP_FROM: ${{ secrets.SZHITCH_SMTP_FROM }}
          SZHITCH_SMTP_SSL: ${{ secrets.SZHITCH_SMTP_SSL }}
          SZHITCH_WECOM: ${{ secrets.SZHITCH_WECOM }}
          SZHITCH_FEISHU: ${{ secrets.SZHITCH_FEISHU }}
          SZHITCH_BARK: ${{ secrets.SZHITCH_BARK }}
          # 私有控制面（可选）：配置 URL + 内部令牌后，订阅规则与发信切换到后台。
          SZHITCH_CONTROL_PLANE_URL: ${{ secrets.SZHITCH_CONTROL_PLANE_URL }}
          SZHITCH_INTERNAL_TOKEN: ${{ secrets.SZHITCH_INTERNAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # legacy Issue（迁移完成后可移除）
        run: python main.py once --export dashboard/dashboard.json

      - name: 保存本轮状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: szhitch-state-${{ github.run_id }}

      - name: 提交面板数据
        if: steps.freshness.outputs.skip != 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/dashboard.json
          if git diff --cached --quiet; then
            echo "面板数据无变化"
          else
            git commit -m "chore: 更新顺风车面板数据 [skip ci]"
            git checkout -- .
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      # 发布不跟去重挂钩：长租每年一次 merge 只改 rental.json，
      # 若这轮顺风车数据恰好是新的，跳过 deploy 就会让面板继续 404/旧数据。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
