name: 部署私有控制面

# 只手动触发。部署前必须：
#   1. 把 control-plane/wrangler.jsonc 的 database_id 换成真实 D1 ID
#   2. 配好 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#   3. 用 wrangler secret put 配置后台运行时 Secret
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: szhitch-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 检查占位配置
        run: |
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.jsonc; then
            echo "::error::请先把 wrangler.jsonc 的 D1 database_id 替换成真实值"
            exit 1
          fi
          if grep -q 'REPLACE_WITH_GITHUB_APP_CLIENT_ID' wrangler.jsonc; then
            echo "::error::请先替换 GitHub App Client ID"
            exit 1
          fi
      - name: 单元测试
        run: npm test
      - name: 应用 D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply szhitch-control-plane --remote
      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
