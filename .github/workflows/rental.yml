name: 神州长租行情

# 周租 / 半月租 / 月租报价变化没有顺风车那么快，独立每 6 小时刷新一次，
# 避免把 104 城 × 3 档的请求塞进 15 分钟一轮的顺风车任务。
#
# 产物：dashboard/rental.json。这里只提交数据，不单独发布 Pages，
# 避免用旧 dashboard.json 覆盖刚跑完的顺风车数据；下一次 15 分钟监控会带上它发布。

on:
  schedule:
    - cron: "20 2,8,14,20 * * *"
  workflow_dispatch:

concurrency:
  group: szhitch-rental
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rental:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取长租报价
        run: python main.py rentals --export dashboard/rental.json

      - name: 提交行情数据
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/rental.json
          if git diff --cached --quiet; then
            echo "长租行情无变化"
          else
            git commit -m "chore: 更新长租行情 [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
