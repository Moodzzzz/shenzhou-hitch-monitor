name: 神州长租行情

# 全城市（471 城）× 全车型 × 7/15/30 天，一天抓一轮，北京时间 12:00。
# 抓取走代理池（免费池兜底 + SZHITCH_PROXIES 付费池优先），4 路并发，
# 单轮约 10–20 分钟。
#
# 产物：dashboard/rental.json。这里只提交数据，不单独发布 Pages，
# 避免用旧 dashboard.json 覆盖刚跑完的顺风车数据；下一次 15 分钟监控会带上它发布。

on:
  schedule:
    # UTC 04:00 = 北京时间 12:00
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: szhitch-rental
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rental:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取长租报价
        env:
          # 付费/自有代理池：Settings → Secrets 里加 SZHITCH_PROXIES
          # 格式 http://user:pass@host:port，多条用逗号分隔；不配则只用免费池
          SZHITCH_PROXIES: ${{ secrets.SZHITCH_PROXIES }}
        run: python main.py rentals --export dashboard/rental.json

      - name: 提交行情数据
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/rental.json
          if git diff --cached --quiet; then
            echo "长租行情无变化"
          else
            git commit -m "chore: 更新长租行情 [skip ci]"
            git checkout -- .
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
